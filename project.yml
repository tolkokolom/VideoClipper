name: VideoClipper
options:
  bundleIdPrefix: cc.kolom
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"

targets:
  VideoClipper:
    type: application
    platform: macOS
    sources: [VideoClipper]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.kolom.VideoClipper
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: "NO"
        ENABLE_APP_SANDBOX: "NO"

  VideoClipperTests:
    type: bundle.unit-test
    platform: macOS
    sources: [VideoClipperTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: VideoClipper

schemes:
  VideoClipper:
    build:
      targets:
        VideoClipper: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VideoClipperTests
